name: Check FortiClient VPN for updates

on:
  schedule:
    - cron: '0 6 * * 1'   # every Monday at 06:00 UTC
  workflow_dispatch:        # allow manual trigger for testing
    inputs:
      force_rebuild:
        description: 'Pack and attach a draft release even if the real version has not changed (for testing the install script itself)'
        type: boolean
        default: false

permissions:
  contents: write   # commit the version bump and create a draft release

defaults:
  run:
    working-directory: forticlientvpn

jobs:
  check-update:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      latest: ${{ steps.version.outputs.latest }}
      update_needed: ${{ steps.version.outputs.update_needed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      # Fortinet publishes no version API or stable per-version download URL
      # for FortiClient VPN — only a self-updating online installer. The
      # only reliable way to know the real current version is to actually
      # run it and read the MSI it downloads, same as Get-FortiClientVpnMsi.ps1
      # does at install time on an end-user's machine.
      - name: Capture current FortiClient VPN MSI and compare versions
        id: version
        shell: pwsh
        env:
          FORCE_REBUILD: ${{ github.event.inputs.force_rebuild }}
        run: |
          $nuspecPath = 'forticlientvpn.nuspec'
          $current = ([xml](Get-Content $nuspecPath -Raw)).package.metadata.version

          $msi = & .\tools\Get-FortiClientVpnMsi.ps1 -OutputPath (Join-Path $env:RUNNER_TEMP 'capture') -TimeoutSeconds 1200

          Write-Host "Current (nuspec): $current"
          Write-Host "Real (Fortinet):  $($msi.ProductVersion)  [$($msi.ProductName), signed by $($msi.Signer)]"

          "latest=$($msi.ProductVersion)" >> $env:GITHUB_OUTPUT

          $updateNeeded = [Version]$msi.ProductVersion -gt [Version]$current
          if ($updateNeeded) {
              Write-Host "Update available: $current -> $($msi.ProductVersion)"
          } else {
              Write-Host "Already current."
          }
          "update_needed=$updateNeeded" >> $env:GITHUB_OUTPUT

          # Separate from update_needed: lets you pack+release a test build
          # of whatever's already committed, without faking a version bump
          # — e.g. after changing chocolateyinstall.ps1 itself.
          $forceRebuild = $env:FORCE_REBUILD -eq 'true'
          $packNeeded = $updateNeeded -or $forceRebuild
          if (-not $updateNeeded -and $forceRebuild) {
              Write-Host "Forced rebuild requested — packing anyway."
          }
          "pack_needed=$packNeeded" >> $env:GITHUB_OUTPUT

      - name: Bump nuspec version
        if: steps.version.outputs.update_needed == 'true'
        shell: pwsh
        env:
          LATEST: ${{ steps.version.outputs.latest }}
        run: |
          $nuspecPath = 'forticlientvpn.nuspec'
          $content = Get-Content $nuspecPath -Raw
          $content = $content -replace '<version>[^<]+</version>', "<version>$env:LATEST</version>"
          Set-Content -LiteralPath $nuspecPath -Value $content -NoNewline
          Write-Host "nuspec bumped to $env:LATEST"

      - name: Ensure Chocolatey CLI is available
        if: steps.version.outputs.pack_needed == 'true'
        shell: pwsh
        run: |
          if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
              Set-ExecutionPolicy Bypass -Scope Process -Force
              Invoke-Expression ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
          }
          choco --version

      # Packs the .nupkg only — this does NOT run chocolateyinstall.ps1, so
      # it does not itself verify the install script works. It's built so
      # you can download it below and test it yourself with
      # `choco install forticlientvpn -source <folder with this .nupkg>`
      # before ever running `choco push`, which this workflow never does.
      - name: Pack the .nupkg
        if: steps.version.outputs.pack_needed == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\pack" | Out-Null
          choco pack forticlientvpn.nuspec --outputdirectory "$env:RUNNER_TEMP\pack"
          Get-ChildItem "$env:RUNNER_TEMP\pack" | ForEach-Object { Write-Host "Built: $($_.Name)" }

      - name: Upload .nupkg as a workflow artifact
        if: steps.version.outputs.pack_needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: forticlientvpn-${{ steps.version.outputs.latest }}
          path: ${{ runner.temp }}/pack/*.nupkg
          retention-days: 90

      - name: Create a draft release with the built package
        if: steps.version.outputs.pack_needed == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.version.outputs.latest }}
          UPDATE_NEEDED: ${{ steps.version.outputs.update_needed }}
        run: |
          $tag   = "forticlientvpn-v$env:LATEST"
          $nupkg = (Get-ChildItem "$env:RUNNER_TEMP\pack\*.nupkg" | Select-Object -First 1).FullName
          $reason = if ($env:UPDATE_NEEDED -eq 'true') { 'new version detected' } else { 'forced test rebuild, same version' }

          gh release delete $tag --yes --repo $env:GITHUB_REPOSITORY 2>&1 | Out-Null

          $pushNote = if ($env:UPDATE_NEEDED -eq 'true') {
              "A separate job will wait for your approval (GitHub will notify you) before running ``choco push`` on this exact .nupkg."
          } else {
              "Forced test rebuild — never pushed to chocolatey.org automatically."
          }

          gh release create $tag $nupkg `
            --repo $env:GITHUB_REPOSITORY `
            --draft `
            --title "FortiClient VPN $env:LATEST (untested build)" `
            --notes "Built automatically by the update-check workflow ($reason). **Not pushed to chocolatey.org yet.** Download this .nupkg and test it yourself first: ``choco install forticlientvpn -source <folder containing this .nupkg>``. $pushNote"

      - name: Commit nuspec version bump
        if: steps.version.outputs.update_needed == 'true'
        shell: pwsh
        env:
          LATEST: ${{ steps.version.outputs.latest }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add forticlientvpn.nuspec
          git commit -m "Bump forticlientvpn to $env:LATEST (untested build attached to a draft release — verify locally before choco push)"
          git push

  # Only runs when a real new version was detected (never for a force_rebuild
  # test-only dispatch). The `environment: chocolatey-push` gate pauses this
  # job until a required reviewer approves it in the GitHub UI — nothing
  # reaches chocolatey.org without that manual click, even though the rest
  # of the pipeline is fully automated.
  push-to-chocolatey:
    needs: check-update
    if: needs.check-update.outputs.update_needed == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    environment: chocolatey-push
    defaults:
      run:
        working-directory: forticlientvpn

    steps:
      # This job has its own `defaults.run.working-directory: forticlientvpn`
      # (inherited from the workflow-level default), which only exists once
      # the repo is actually checked out — without this step every run:
      # step fails immediately with "the directory name is invalid".
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Download the built .nupkg
        uses: actions/download-artifact@v4
        with:
          name: forticlientvpn-${{ needs.check-update.outputs.latest }}
          path: ${{ runner.temp }}/pack

      - name: Ensure Chocolatey CLI is available
        shell: pwsh
        run: |
          if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
              Set-ExecutionPolicy Bypass -Scope Process -Force
              Invoke-Expression ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
          }
          choco --version

      - name: choco push
        shell: pwsh
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          $nupkg = (Get-ChildItem "$env:RUNNER_TEMP\pack\*.nupkg" | Select-Object -First 1).FullName
          choco push $nupkg --source https://push.chocolatey.org/ --api-key $env:CHOCO_API_KEY

      - name: Mark the release as published
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ needs.check-update.outputs.latest }}
        run: |
          $tag = "forticlientvpn-v$env:LATEST"
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false `
            --title "FortiClient VPN $env:LATEST" `
            --notes "Pushed to chocolatey.org after approval. See the package's moderation page on the Chocolatey Community Repository for review status."
